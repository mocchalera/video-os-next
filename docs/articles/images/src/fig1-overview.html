<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.grid{display:grid;grid-template-columns:1fr 150px 1fr;margin-top:36px;align-items:stretch}
.zone{border:2px solid var(--line);border-radius:18px;padding:22px 22px 20px;background:var(--panel)}
.zone.cloud{border-color:#3b5a7d;background:#122033}
.zt{font-size:32px;font-weight:900}
.zs{font-size:22px;color:var(--sub);margin-top:2px}
.card{margin-top:14px;border-radius:12px;background:#1d2835;padding:14px 18px;border-left:7px solid var(--cool)}
.card.hot{border-left-color:var(--hot)}
.card.ok{border-left-color:var(--ok)}
.ct{font-size:30px;font-weight:900;line-height:1.3}
.cd{font-size:24px;color:var(--sub);margin-top:4px;line-height:1.45}
.mid{display:flex;flex-direction:column;justify-content:center;gap:70px;padding:0 14px}
.arrow{text-align:center}
.arrow .lbl{font-size:25px;font-weight:900;line-height:1.3}
.arrow .bar{height:7px;border-radius:4px;margin-top:12px;position:relative}
.r .bar{background:var(--hot)} .r .bar:after{content:"";position:absolute;right:-4px;top:-10px;border:13px solid transparent;border-left:20px solid var(--hot);border-right:0}
.l .bar{background:var(--ok)} .l .bar:after{content:"";position:absolute;left:-4px;top:-10px;border:13px solid transparent;border-right:20px solid var(--ok);border-left:0}
.hf{margin-top:14px;border:2px dashed #3b5a7d;border-radius:12px;padding:12px 16px;font-size:23px;color:var(--sub)}
.hf b{color:var(--ink)}
.bottom{margin-top:22px;display:flex;gap:16px}
.bottom .card{flex:1;margin-top:0}
</style></head><body><div class="fig">
<div class="kicker">図1　全体像</div>
<h1>手元の Mac から、Colab の GPU を<br>「借りて・使って・返す」</h1>
<div class="grid">
  <div class="zone">
    <div class="zt">手元の Mac</div>
    <div class="card"><div class="ct">AI エージェント</div><div class="cd">「紙の船が流れる<br>5秒のカットを作って」</div></div>
    <div class="card"><div class="ct">vos（道具箱）</div><div class="cd">借りる・作る・<br>見る・返す</div></div>
    <div class="card hot"><div class="ct">見張り番</div><div class="cd">放置された GPU を<br>止める（図2）</div></div>
  </div>
  <div class="mid">
    <div class="arrow r"><div class="lbl">依頼<br>命令</div><div class="bar"></div></div>
    <div class="arrow l"><div class="lbl">完成<br>した動画</div><div class="bar"></div></div>
  </div>
  <div class="zone cloud">
    <div class="zt">Google Colab</div>
    <div class="card"><div class="ct">受付係</div><div class="cd">依頼を順番に処理</div></div>
    <div class="card"><div class="ct">ComfyUI（画面なし）</div><div class="cd">配線図どおりに実行</div></div>
    <div class="card"><div class="ct">MiniMax H3</div><div class="cd">音声付きの動画を生成</div></div>
    <div class="hf">モデル <b class="num">58GB</b> を約 <b class="num">3</b> 分で取得</div>
  </div>
</div>
<div class="bottom">
  <div class="card ok"><div class="ct">素材として登録</div><div class="cd">作り方の記録つき</div></div>
  <div class="card ok"><div class="ct">ドライブで共有</div><div class="cd">他の作品でも再利用</div></div>
</div>
</div></body></html>
