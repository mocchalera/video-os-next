<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1280px;height:670px;overflow:hidden}
.c{position:relative;width:1280px;height:670px;background:#0b1118}
.bg{position:absolute;right:-60px;top:-40px;width:1000px;height:760px;object-fit:cover;object-position:60% 55%;filter:brightness(1.18) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#0b1118 0%,#0b1118 30%,rgba(11,17,24,.85) 45%,rgba(11,17,24,.15) 72%,rgba(11,17,24,0) 100%)}
.txt{position:absolute;left:72px;top:92px;width:640px}
.tag{display:inline-block;font-size:19px;font-weight:700;color:var(--hot);letter-spacing:.14em;border:2px solid var(--hot);padding:6px 14px;border-radius:4px}
h1{font-size:62px;line-height:1.28;margin-top:28px;font-weight:900;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--hot)}
.sub{font-size:25px;color:#c9d5e2;margin-top:26px;line-height:1.55;font-weight:700}
.cap{position:absolute;left:72px;bottom:44px;font-size:17px;color:var(--dim);letter-spacing:.04em}
.cap b{color:var(--sub);font-weight:700}
</style></head><body><div class="c">
<img class="bg" src="frames/cover.jpg"><div class="shade"></div>
<div class="txt">
<span class="tag">GOOGLE COLAB × COMFYUI</span>
<h1>AIエージェントに<br><em>借りたGPU</em>で<br>映像を作らせる</h1>
<div class="sub">Colab 上の ComfyUI を「道具」にして、<br>生成から返却まで任せる仕組み</div>
</div>
<div class="cap">背景の紙の船も、この仕組みで生成した映像です <b>MiniMax H3 / A100</b></div>
</div></body></html>
