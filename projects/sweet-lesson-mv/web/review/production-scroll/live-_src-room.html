  t0      song time at local 0
  cam     {"$data": "data/camera.json"}  camera keys (room / dc), dcMix, flash

  // ---------------- procedural textures (deterministic) ----------------
  const cv = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const texOf = (c, srgb = true, rep) => { const t = new THREE.CanvasTexture(c); canvasTexs.push(t); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };

    ceil: new THREE.MeshStandardMaterial({ map: wallTex, bumpMap: wallBump, bumpScale: 1.6, roughness: 0.95, color: 0xf2f0ea }),
    floor: new THREE.MeshStandardMaterial({ map: floorTex, roughnessMap: floorRough, roughness: 1.35, bumpMap: floorRough, bumpScale: 0.25 }),
    skirting: new THREE.MeshStandardMaterial({ color: 0xcfc9bf, roughness: 0.6 }),
    alu: new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.85, roughness: 0.38 }),

    lace: null, drape: null,

    sheet: new THREE.MeshStandardMaterial({ map: texOf(fabricCanvas(22, "rgb(168,170,172)"), true, [3, 3]), roughness: 0.96 }),
    pillow: new THREE.MeshStandardMaterial({ map: texOf(fabricCanvas(23, "rgb(200,203,208)"), true, [2, 2]), roughness: 0.95 }),
    bedframe: new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: 0.6 }),
    deskTop: new THREE.MeshStandardMaterial({ map: texOf(noiseCanvas(512, 512, 31, "rgb(206,198,184)", 12), true, [1, 1]), roughnessMap: grimeTex2, roughness: 1.0 }),
    steel: new THREE.MeshStandardMaterial({ color: 0x2a2b2e, metalness: 0.7, roughnessMap: grimeTex, roughness: 1.0 }),
    blackPlastic: new THREE.MeshStandardMaterial({ color: 0x17181b, roughnessMap: grimeTex, roughness: 1.1 }),
    matteBlack: new THREE.MeshStandardMaterial({ color: 0x0c0d0f, roughness: 0.8 }),

  // ---------------- geometry helpers ----------------
