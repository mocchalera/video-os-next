  <div class="hero-jp mask" style="font-size:150px;height:170px"><span class="ig-t">全部、見る。</span></div>
  <div class="mono ig-sub" style="font-size:20px;letter-spacing:.3em;margin-top:6px;color:var(--te)">EVERY CLIP. ON YOUR MAC.</div>

<script>
vos.graphic(({ tl, q, qa, props, slotClips }) => {
  // filenames come from the asset records of the clips the timeline put in each slot
  qa(".ig-cell").forEach((cell, i) => {
    const clip = slotClips("c" + (i + 1))[0];
    const rec = clip && props.files && props.files[clip.alias];
    cell.querySelector(".ig-fn").textContent = rec ? rec.filename : (clip ? clip.alias : "");
    gsap.set(cell, { opacity: 0, scale: 0.82 });
    tl.to(cell, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, i * 0.125);
  });
  const grid = q(".ig-grid");
  tl.to(grid, { scale: 1.08, duration: 3.3, ease: "none" }, 0);
  gsap.set(q(".ig-band"), { scaleY: 0 });
  gsap.set(q(".ig-t"), { yPercent: 110 });
  gsap.set(q(".ig-sub"), { opacity: 0 });
  const focus = qa(".ig-cell")[props.focus ?? 7];
  const fx = parseFloat(focus.style.left) + 137, fy = parseFloat(focus.style.top) + 77;
  tl.to(q(".ig-band"), { scaleY: 1, duration: 0.4, ease: "power3.inOut" }, 1.9)
    .to(q(".ig-t"), { yPercent: 0, duration: 0.55, ease: "expo.out" }, 2.0)
    .to(q(".ig-sub"), { opacity: 1, duration: 0.3 }, 2.4)
    .to([q(".ig-band"), q(".ig-title")], { opacity: 0, duration: 0.25 }, 3.3)
    .to(grid, { scale: 7.2, x: (870 - fx) * 7.2, y: (420 - fy) * 7.2, duration: 0.75, ease: "expo.in" }, 3.3);
});
</script>
