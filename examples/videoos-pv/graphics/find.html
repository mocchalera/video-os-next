<style>
.fd-bar{position:absolute;left:410px;top:150px;width:1100px;height:78px;border:1px solid rgba(242,239,233,.28);background:rgba(255,255,255,.03);font-size:28px;line-height:76px;padding-left:74px}

<div class="sect fd-sect" style="top:150px;left:96px"><div class="no">02 — FIND</div><div class="en" style="font-size:120px">FIND</div><div class="jp" style="font-size:44px">探す</div></div>

<div class="abs fd-chips" style="left:410px;top:246px"><span class="chip"><b>VISUAL</b> Qwen3-VL</span><span class="chip"><b>TEXT</b> E5</span><span class="chip"><b>AUDIO</b> CLAP</span><span class="chip"><b>TIME</b> Marlin find</span></div>
<div class="slot abs fd-viewer" data-slot="viewer"><div class="abs mono fd-tc"></div></div>
<div class="fd-scrub"><img src="vos://asset/シーン4_b@0.83"><img src="vos://asset/シーン4_b@2.5"><img src="vos://asset/シーン4_b@4.17"><img src="vos://asset/シーン4_b@5.83"><img src="vos://asset/シーン4_b@7.5"><img src="vos://asset/シーン4_b@9.17"></div>
<div class="fd-span s1"></div><div class="fd-span s2"></div>
<div class="fd-slab mono l1"></div><div class="fd-slab mono l2"></div>
<div class="fd-res mono r1" style="top:320px"></div><div class="fd-res mono r2" style="top:480px"></div>
<div class="abs fd-copy" style="left:1545px;top:880px;width:330px;font-weight:700;font-size:34px;line-height:1.4">言葉で、<br>瞬間を探す。</div>
<script>
vos.graphic(({ tl, q, qa, props, onFrame, sourceTime }) => {
  const d = props.describe, dur = props.asset.duration, W = 1100;
  // each query's span and the Marlin event that best overlaps it — all from the real record
  const hits = props.queries.map((qq) => {
    const f = d.finds.find((x) => x.query === qq.query);
    const ev = d.events.map((e) => ({ e, o: Math.min(e.end, f.end) - Math.max(e.start, f.start) })).sort((a, b) => b.o - a.o)[0].e;
    return { ...qq, f, ev };
  });
  hits.forEach((h, i) => {
    const n = i + 1;
    const x = 410 + (h.f.start / dur) * W, w = ((h.f.end - h.f.start) / dur) * W;
    Object.assign(q(".s" + n).style, { left: x + "px", width: w + "px" });
    Object.assign(q(".l" + n).style, { left: x + "px" });
    q(".l" + n).textContent = h.f.start.toFixed(1) + "–" + h.f.end.toFixed(1) + "s";
    q(".r" + n).innerHTML = '<div class="t">MATCH · ' + props.asset.filename + "</div>" + h.f.start.toFixed(1) + "–" + h.f.end.toFixed(1) + "s<br>“" + h.ev.description + "”";
    tl.fromTo(q(".s" + n), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "0 50%", duration: 0.35, ease: "expo.out", immediateRender: false }, h.hitAt)
      .to(q(".l" + n), { opacity: 1, duration: 0.2 }, h.hitAt)
      .to(q(".r" + n), { opacity: 1, duration: 0.3 }, h.hitAt + 0.1)
      .fromTo(q(".fd-viewer"), { boxShadow: "0 0 0 0px #ff5a1f" }, { boxShadow: "0 0 0 3px #ff5a1f", duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, h.hitAt);
    if (i > 0) tl.to([q(".s" + i), q(".l" + i)], { opacity: 0.35, duration: 0.3 }, h.hitAt);
  });
  tl.from(q(".fd-sect"), { opacity: 0, x: -30, duration: 0.5, ease: "power3.out" }, 0)
    .from(q(".fd-bar"), { scaleX: 0, transformOrigin: "0 50%", duration: 0.45, ease: "expo.out" }, 0)
    .from(qa(".fd-chips .chip"), { opacity: 0, y: 10, duration: 0.3, stagger: 0.06 }, 0.2)
    .from(q(".fd-viewer"), { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 0.1)
    .from(q(".fd-scrub"), { opacity: 0, duration: 0.4 }, 0.3)
    .from(q(".fd-copy"), { opacity: 0, y: 20, duration: 0.5, ease: "power3.out" }, 6.0)
    .to(q(".fd-copy").parentNode.children, { opacity: 0, duration: 0.25 }, 7.8);
  const type = (s, t, t0, cps) => (t < t0 ? "" : s.slice(0, Math.min(s.length, Math.floor((t - t0) * cps))));
  onFrame((t) => {
    const cur = hits.filter((h) => t >= h.typeAt).pop();
    q(".fd-q").textContent = cur ? type(cur.query, t, cur.typeAt, 36) : "";
    q(".fd-caret").style.opacity = Math.floor(t * 4) % 2 === 0 ? 1 : 0.15;
    const st = sourceTime("viewer", t);
    q(".fd-tc").textContent = st ? props.asset.filename + "  " + st.t.toFixed(2) + "s" : "";
  });
});
</script>
