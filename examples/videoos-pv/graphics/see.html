<script>
vos.graphic(({ tl, q, qa, props, onFrame, sourceTime }) => {
  const d = props.describe; // bound to the real Marlin record of the source clip
  const W = 760, span = props.eventSpan ?? 6;
  q(".sp-evlab").textContent = "EVENTS · " + props.sourceFile;
  const box = q(".sp-evbox");
  const bars = d.events.map((e, i) => {
    const el = document.createElement("div");
    el.className = "sp-ev mono";
    el.style.left = (e.start / span) * W + "px";
    el.style.top = i * 40 + "px";
    el.style.width = Math.max(24, ((e.end - e.start) / span) * W) + "px";
    el.textContent = e.start.toFixed(1) + "–" + e.end.toFixed(1) + " " + e.description.replace(/^The (person|woman) /, "").replace(/\.$/, "");
    box.appendChild(el);
    return el;
  });
  const peak = d.finds.find((f) => f.query === props.peakQuery);
  const peakEv = d.events.find((e) => peak && e.start <= peak.end && e.end >= peak.start && e.start >= peak.start - 0.5) || d.events[0];
  q(".sp-peaktag").textContent = "PEAK · " + peak.start.toFixed(1) + "–" + peak.end.toFixed(1) + "s · " + peak.query;
  q(".sp-peakev").textContent = "“" + peakEv.description + "”";

  tl.fromTo(q(".sp-v"), { scale: 1.18 }, { scale: 1.04, duration: 4.1, ease: "power2.out" }, 0)
    .from(q(".sp-en"), { xPercent: 40, opacity: 0, duration: 0.8, ease: "expo.out" }, 0.5)
    .from(bars, { scaleX: 0, transformOrigin: "0 50%", duration: 0.5, stagger: 0.12, ease: "power3.out" }, 0.9)
    .to(q(".sp-a"), { opacity: 0, duration: 0.25 }, 3.85)
    .to(q(".sp-b"), { opacity: 1, duration: 0.2 }, 3.95);
  const pgs = qa(".sp-pg");
  gsap.set(pgs, { opacity: 0 });
  gsap.set(q(".sp-strip"), { opacity: 0 });
  tl.to(pgs, { opacity: 1, duration: 0.2, stagger: 0.03 }, 4.0)
    .set(q(".st1"), { className: "st1 on" }, 4.0)
    .to(pgs, { opacity: 0, scale: 0.6, duration: 0.3, stagger: 0.01, ease: "power2.in" }, 4.85)
    .to(q(".sp-strip"), { opacity: 1, duration: 0.3 }, 5.0)
    .fromTo(q(".sp-strip"), { scaleX: 0.4 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 5.0)
    .set(q(".st2"), { className: "st2 on" }, 5.0)
    .to(q(".sp-strip"), { scale: 4.2, x: -420, duration: 0.6, ease: "expo.in" }, 5.9)
    .to(q(".sp-peak"), { opacity: 1, duration: 0.15 }, 6.4)
    .set(q(".st3"), { className: "st3 on" }, 6.4)
    .fromTo(q(".sp-box"), { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 6.5)
    .fromTo(q(".sp-peakimg"), { scale: 1.12 }, { scale: 1, duration: 1.6, ease: "power2.out" }, 6.4)
    .fromTo(q(".sp-b"), { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 100%)", duration: 0.4, ease: "expo.in", immediateRender: false }, 7.6);

  const type = (s, t, t0, cps) => (t < t0 ? "" : s.slice(0, Math.min(s.length, Math.floor((t - t0) * cps))));
  const scene = d.scene.split(". ").slice(0, 3).join(". ") + " …";
  onFrame((t) => {
    q(".sp-text").textContent = type(scene, t, 0.35, 75);
    const st = sourceTime("photo", t);
    const s = st ? st.t - (props.masterToSource ?? 0) : 0;
    bars.forEach((el, i) => el.classList.toggle("on", s >= d.events[i].start && s < d.events[i].end));
    q(".sp-head").style.left = Math.max(0, Math.min(W, (s / span) * W)) + "px";
  });
});
</script>
